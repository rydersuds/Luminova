<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff login — Massage Fenix</title>
  <meta name="theme-color" content="#1b2a45">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) { /* storage unavailable */ }
  </script>
  <link rel="icon" type="image/png" href="/images/logo-mark-64.png">
  <link rel="apple-touch-icon" href="/images/logo-mark-180.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login-card {
      width: min(420px, 100%); padding: 34px 30px 28px; border-radius: 28px; text-align: center;
      background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-edge); box-shadow: var(--glass-rim), var(--glass-drop);
    }
    .login-card .brand { justify-content: center; margin: 0 auto 18px; }
    .login-card .brand-logo { height: 116px; }
    .login-card h1 { font-size: 1.7rem; margin-bottom: .2em; }
    .login-card .lead { color: var(--ink-soft); margin: 0 0 22px; }
    .login-card form { display: grid; gap: 14px; text-align: left; }
    .login-card label { display: grid; gap: 6px; font-weight: 700; font-size: .92rem; color: var(--heading); }
    .login-card input {
      font: 400 1rem var(--sans); padding: 13px 16px; border-radius: 14px; color: var(--ink);
      border: 1px solid var(--glass-edge); background: var(--glass-lite); box-shadow: var(--glass-rim);
    }
    .login-card input:focus { outline: none; border-color: var(--gold); box-shadow: var(--glass-rim), 0 0 0 4px rgba(201, 165, 92, .22); }
    .login-card .btn { width: 100%; margin-top: 4px; }
    .login-msg { margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; background: var(--alert-bg); color: var(--alert-ink); font-size: .92rem; }
    .back { display: inline-block; margin-top: 18px; font-size: .9rem; color: var(--ink-soft); text-decoration: none; }
    .back:hover { color: var(--heading); }
  </style>
</head>
<body>
  <!--FILE-NOTICE-->
  <script>
    // Opened straight from a folder (not through the server): explain, and keep server-only
    // links (Staff login, the admin, logging in) from leading to a "file not found" page.
    if (location.protocol === 'file:') {
      document.write('<div id="file-notice" style="position:sticky;top:0;z-index:9999;margin:0;padding:14px 18px;background:#152139;color:#fff;font:15px/1.5 system-ui,sans-serif;border-bottom:3px solid #c9a55c">' +
        '<strong style="color:#e2c992">You\u2019ve opened the website\u2019s source file directly.</strong> ' +
        '<span id="file-notice-extra"></span>It needs its server for styles, booking, Staff login and the admin. To run it: extract the whole zip, run <code style="background:rgba(255,255,255,.12);padding:1px 6px;border-radius:4px">npm start</code> in the folder and open http://localhost:3000 (see HOW-TO-VIEW.txt). ' +
        'To just look around, open the preview files in <strong>massage-fenix-previews.zip</strong> (website-preview.html has a working Staff login and admin).</div>');
      var stop = function (e) {
        var t = e.target.closest && e.target.closest('a[href^="/"], form[action^="/"] button, form[action^="/"] [type=submit]');
        if (!t) return;
        e.preventDefault();
        var extra = document.getElementById('file-notice-extra'), box = document.getElementById('file-notice');
        if (extra) { extra.innerHTML = '<br><strong style="color:#ffb4a2">That link needs the server, so it can\u2019t open from a file.</strong><br>'; }
        if (box) { box.scrollIntoView({ block: 'start' }); box.style.outline = '3px solid #ff5a36'; }
      };
      document.addEventListener('click', stop, true);
      document.addEventListener('submit', function (e) { if (e.target.matches && e.target.matches('form[action^="/"]')) stop({ target: e.target.querySelector('button') || e.target, preventDefault: function () { e.preventDefault(); } }); }, true);
    }
  </script>
  <!--/FILE-NOTICE-->
  <main class="login-wrap">
    <div class="login-card">
      <a class="brand" href="/" aria-label="Massage Fenix website">
        <img class="brand-logo logo-light" src="/images/logo.png" alt="Massage Fenix" width="400" height="262">
        <img class="brand-logo logo-dark" src="/images/logo-dark.png" alt="" width="400" height="262">
      </a>
      <h1>Staff login</h1>
      <p class="lead">Manage appointments, hours and time off.</p>
      <!--MESSAGE-->
      <form method="post" action="/admin/login">
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button class="btn btn-gold" type="submit">Log in</button>
      </form>
      <a class="back" href="/">← Back to the website</a>
    </div>
  </main>
</body>
</html>
